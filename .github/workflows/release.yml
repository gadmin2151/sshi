name: Build and test SSHI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  supersede:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release SSHI ')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Stop superseded builds of this release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resource="repos/$GITHUB_REPOSITORY/actions"
          gh api "$resource/workflows/release.yml/runs?branch=main&event=push&per_page=20" |
            jq --argjson current "$GITHUB_RUN_NUMBER" -r '.workflow_runs[] | select(.run_number < $current and (.status == "queued" or .status == "in_progress")) | .id' |
            while read -r run; do
              gh api -X POST "$resource/runs/$run/cancel" || {
                test "$(gh api "$resource/runs/$run" --jq .status)" = completed
              }
            done

  packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, target: x86_64-unknown-linux-gnu}
          - {arch: arm64, target: aarch64-unknown-linux-gnu}
          - {arch: armhf, target: armv7-unknown-linux-gnueabihf}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker buildx build --file packaging/Dockerfile --build-arg SSHI_TARGETS="${{ matrix.target }}" --output type=local,dest=dist .
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio zstd
          if [ "${{ matrix.arch }}" != armhf ]; then sh packaging/build-rpm.sh dist/*.deb; fi
          python3 packaging/check-release.py --source --dist dist
      - name: Build and test the Arch Linux package
        if: matrix.arch == 'amd64'
        run: |
          # Official archlinux:base-devel-20261108.0.623074
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/packaging/build-arch.sh,target=/build-arch.sh,readonly" \
            --mount "type=bind,source=$PWD/dist,target=/dist" \
            archlinux@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239 bash -euc '
              useradd -m builder
              runuser -u builder -- bash /build-arch.sh /dist/*_amd64.deb /tmp/packages
              pkg=(/tmp/packages/*.pkg.tar.zst)
              pacman --noconfirm -Udd "${pkg[0]}"
              test "$(sshi --version)" = "sshi $(pacman -Q sshi | cut -d" " -f2 | cut -d- -f1)"
              test -x /usr/bin/sshi-desktop
              test -f /usr/lib/systemd/user/sshi.service
              echo "# preserved by pacman" >> /etc/sshi/config.toml
              pacman --noconfirm -Udd "${pkg[0]}"
              grep -Fxq "# preserved by pacman" /etc/sshi/config.toml
              install -m644 "${pkg[0]}" /dist/
            '
          python3 packaging/check-release.py --dist dist
      - if: matrix.arch == 'amd64'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo install --locked --version 1.5.0 --debug --features server iroh-relay
          sudo apt-get install -y xvfb gir1.2-gtk-3.0 python3-gi ./dist/*_amd64.deb
          sshi --version
          xvfb-run -a sshi-desktop --smoke-test
          for test in profile_clicks gtk_forward gtk_invitation; do
            if ! xvfb-run -a /usr/bin/python3 "tests/$test.py" /usr/bin/sshi > "$RUNNER_TEMP/gtk-test.log" 2>&1; then
              tail -15 "$RUNNER_TEMP/gtk-test.log" | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
            cat "$RUNNER_TEMP/gtk-test.log"
          done
          tests/run-relay-smoke.sh dist/*_amd64.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  windows:
    runs-on: windows-2022
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo test --locked --features windows-client --bin sshi-windows --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --features windows-client --bin sshi-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/sshi-windows.exe "dist/sshi-$version-windows-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          set -o pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo test --locked
          bash packaging/build-mac.sh 2>&1 | tee "$RUNNER_TEMP/sshi-mac-build.log"
          python3 packaging/check-release.py --source --dist dist
          sudo installer -pkg dist/*.pkg -target /
          test "$(sshi --version)" = "sshi $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/SSHI.app/Contents/Info.plist)"
          test -f /etc/sshi/config.toml
          test -x /usr/local/bin/sshi-copy-iid
          sshi id
          /Applications/SSHI.app/Contents/MacOS/SSHI --smoke-test
          bash desktop/macos/test-clicks.sh 2>&1 | tee "$RUNNER_TEMP/sshi-mac-gui.log"
      - if: failure()
        run: |
          if test -f "$RUNNER_TEMP/sshi-mac-build.log"; then
            tail -40 "$RUNNER_TEMP/sshi-mac-build.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
          if test -f "$RUNNER_TEMP/sshi-mac-gui.log"; then
            head -40 "$RUNNER_TEMP/sshi-mac-gui.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: dist/*.pkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && (github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release SSHI ')))
    needs: [packages, linux, mac, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify, checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          ( cd dist && sha256sum * > SHA256SUMS )
          sudo apt-get update && sudo apt-get install -y rpm2cpio zstd
          python3 packaging/check-release.py --source --dist dist
          for arch in amd64 arm64 armhf; do test -s "dist/sshi_${version}_${arch}.deb"; done
          for arch in x86_64 aarch64; do test -s "dist/sshi-$version-1.$arch.rpm"; done
          test -s "dist/sshi-$version-1-x86_64.pkg.tar.zst"
          test -s "dist/sshi-$version-windows-x64.exe"
          test -s "dist/sshi-$version-macos-arm64.pkg"
          gh release create "$tag" --target "$GITHUB_SHA" --title "SSHI $version" --notes-file docs/release.md dist/*
