[package]
name = "iroh-ssh"
version = "0.5.2"
edition = "2024"
rust-version = "1.91"
default-run = "iroh-ssh"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
russh-sftp = "3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = "1"

[features]
windows-client = ["dep:embed-resource", "dep:russh", "dep:windows-sys"]

[build-dependencies]
embed-resource = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rpassword = "7.5"
toml_edit = "0.25"

[[bin]]
name = "sshi-windows"
path = "src/bin/sshi-windows/main.rs"
required-features = ["windows-client"]

[target.'cfg(windows)'.dependencies]
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa", "flate2"], optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
